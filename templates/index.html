<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>賞鳥潮汐查詢</title>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 22px;
      color: #e0e0e0;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    /* ── Tab 切換 ── */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 8px;
      border: 1px solid #3a5a6a;
      background: #1a3a5a;
      color: #b0c8d8;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      text-align: center;
    }
    .tab-btn.active {
      background: #3a8a5a;
      color: #e0f0e0;
      border-color: #3a8a5a;
      font-weight: 600;
    }
    .tab-btn:hover { background: #2a4a6a; }

    /* ── 地區按鈕方格 ── */
    .location-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .loc-btn {
      padding: 12px 8px;
      border: 2px solid #3a5a6a;
      background: #1a3a5a;
      color: #b0c8d8;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.2s;
      text-align: center;
    }
    .loc-btn:hover {
      background: #2a4a6a;
    }
    .loc-btn.active {
      border-color: #5abb6a;
      background: #3a8a5a;
      color: #e0f0e0;
    }

    /* ── 天數選擇器 ── */
    .days-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .days-selector label { color: #a0a0b0; font-size: 14px; }
    .days-selector select {
      padding: 6px 12px;
      background: #16213e;
      color: #e0e0e0;
      border: 1px solid #3a3a5c;
      border-radius: 6px;
      font-size: 14px;
    }

    /* ── 結果區塊 ── */
    .result-panel { display: none; }
    .result-panel.active { display: block; }

    .loading {
      text-align: center;
      color: #a0a0b0;
      padding: 30px 20px;
      font-size: 14px;
    }
    .error {
      text-align: center;
      color: #e94560;
      padding: 20px;
      font-size: 14px;
    }

    /* ── 功能一：最高五天表格 ── */
    .top3-card {
      background: #16213e;
      border: 1px solid #3a3a5c;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .top3-card h3 {
      color: #e94560;
      font-size: 15px;
      margin-bottom: 10px;
      text-align: center;
    }
    .top4-table {
      width: 100%;
      border-collapse: collapse;
    }
    .top4-table th {
      color: #808090;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 4px;
      border-bottom: 2px solid #3a3a5c;
      text-align: center;
      white-space: nowrap;
    }
    .top4-table td {
      padding: 8px 4px;
      border-bottom: 1px solid #2a2a4a;
      font-size: 14px;
      text-align: center;
      white-space: nowrap;
    }
    .top4-table tr:last-child td { border-bottom: none; }
    .top4-table .date { color: #e0e0e0; }
    .top4-table .lunar { font-size: 11px; color: #808090; }
    .top4-table .tide-range { font-size: 12px; color: #e94560; }
    .top4-table .t-time { color: #c0c0d0; font-variant-numeric: tabular-nums; }
    .top4-table .t-height { font-weight: 600; font-variant-numeric: tabular-nums; }
    .top4-table .t-height.max { color: #e94560; }
    .top4-table .t-height.non-max { color: #a0a0b0; }
    .top4-table .dash { color: #606070; }

    /* ── 功能二：每日潮汐+天氣 ── */
    .detail-day {
      background: #16213e;
      border: 1px solid #3a3a5c;
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .detail-day-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #1a2744;
      border-bottom: 1px solid #3a3a5c;
      gap: 6px;
    }
    .detail-day-header .date { font-size: 15px; font-weight: 600; color: #e0e0e0; }
    .detail-day-header .lunar { font-size: 12px; color: #808090; }
    .detail-day-header .tide-range { font-size: 13px; color: #e94560; }

    .detail-body { padding: 10px 12px; }

    .tide-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px dashed #2a2a4a;
    }
    .tide-row:last-child { border-bottom: none; }
    .tide-row .type { width: 44px; font-size: 13px; font-weight: 600; }
    .tide-row .type.high { color: #e94560; }
    .tide-row .type.low { color: #5b9bd5; }
    .tide-row .t-time { width: 52px; font-size: 13px; color: #c0c0d0; font-variant-numeric: tabular-nums; }
    .tide-row .t-height { flex: 1; font-size: 13px; color: #a0a0b0; }
    .tide-row .t-dn { font-size: 11px; padding: 1px 6px; border-radius: 3px; }
    .dn-day { background: #2d4a3e; color: #6abf69; }
    .dn-night { background: #2d3a5e; color: #7b9bcc; }

    .weather-section {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #2a2a4a;
    }
    .weather-section h4 {
      font-size: 12px;
      color: #a0a0b0;
      margin-bottom: 6px;
    }
    .weather-row {
      display: grid;
      grid-template-columns: 70px 1fr 36px 32px 36px 40px;
      gap: 4px;
      padding: 3px 0;
      font-size: 12px;
      align-items: center;
    }
    .weather-header {
      color: #808090;
      font-weight: 600;
      border-bottom: 1px solid #2a2a4a;
      padding-bottom: 3px;
    }
    .weather-data { color: #c0c0d0; }
    .weather-data .wx-rain { color: #5b9bd5; }
    .weather-data .wx-clear { color: #e8b04b; }
    .weather-data .pop-high { color: #e94560; font-weight: 600; }

    /* ── 日出日落 ── */
    .sun-section {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #2a2a4a;
      display: flex;
      justify-content: center;
      gap: 24px;
    }
    .sun-item {
      font-size: 13px;
      color: #c0c0d0;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sun-icon {
      font-size: 14px;
      font-weight: 700;
    }
    .sun-item .sun-icon { color: #e8b04b; }
    .sun-item:last-child .sun-icon { color: #7b5b8a; }
    .sun-time { font-variant-numeric: tabular-nums; font-weight: 600; color: #e0e0e0; }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: #606070;
      line-height: 1.6;
    }

    /* ── 功能三：年度潮汐月曆 ── */
    .annual-source-badge {
      text-align: center;
      font-size: 11px;
      margin-bottom: 10px;
      padding: 3px 10px;
      border-radius: 4px;
      display: inline-block;
    }
    .annual-source-badge.local {
      background: #2d4a3e;
      color: #6abf69;
    }
    .annual-source-badge.api {
      background: #2d3a5e;
      color: #7b9bcc;
    }
    .annual-source-wrap {
      text-align: center;
      margin-bottom: 10px;
    }

    .month-card {
      background: #16213e;
      border: 1px solid #3a3a5c;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .month-card-header {
      padding: 8px 12px;
      background: #1a2744;
      border-bottom: 1px solid #3a3a5c;
      font-size: 15px;
      font-weight: 600;
      color: #e0e0e0;
      text-align: center;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      padding: 6px;
    }
    .cal-weekday {
      text-align: center;
      font-size: 11px;
      color: #808090;
      font-weight: 600;
      padding: 4px 0;
    }
    .cal-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      cursor: pointer;
      position: relative;
      font-size: 13px;
      transition: all 0.15s;
      gap: 1px;
    }
    .cal-day.empty {
      cursor: default;
    }
    .cal-day .day-num {
      font-weight: 700;
      font-size: 19px;
      line-height: 1;
    }
    .cal-day .day-tide {
      font-size: 15px;
      color: #000;
      line-height: 1;
      margin-top: 2px;
    }
    .cal-day.has-data:hover {
      transform: scale(1.12);
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .cal-day.selected {
      box-shadow: 0 0 0 2px #5abb6a;
      z-index: 5;
    }
    .cal-day .spring-tide-mark {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: #ff2222;
      border-radius: 5px 5px 0 0;
      box-shadow: 0 0 4px #ff2222, 0 0 2px #ff2222;
    }

    /* 潮高色階：從低(深藍)到高(亮紅) */
    .tide-level-0 { background: #1a2a3e; color: #606070; }
    .tide-level-1 { background: #1e3a5e; color: #b0c8d8; }
    .tide-level-2 { background: #2d5a7e; color: #c0d8e8; }
    .tide-level-3 { background: #3d7a6e; color: #d0e8d8; }
    .tide-level-4 { background: #5a8a4e; color: #e0f0d0; }
    .tide-level-5 { background: #8a8a3e; color: #f0f0d0; }
    .tide-level-6 { background: #b06a2e; color: #f0e0c0; }
    .tide-level-7 { background: #c04a2e; color: #ffe0d0; }
    .tide-level-8 { background: #e94560; color: #fff0f0; }

    .calendar-legend {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      margin: 8px 0;
      flex-wrap: wrap;
    }
    .legend-label {
      font-size: 11px;
      color: #808090;
      margin: 0 4px;
    }
    .legend-swatch {
      width: 18px;
      height: 14px;
      border-radius: 3px;
      display: inline-block;
    }

    .day-detail-popup {
      background: #1a2744;
      border: 1px solid #3a5a6a;
      border-radius: 8px;
      padding: 10px 12px;
      margin: 6px 0;
    }
    .day-detail-popup .popup-date {
      font-size: 15px;
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 2px;
    }
    .day-detail-popup .popup-lunar {
      font-size: 12px;
      color: #808090;
      margin-bottom: 6px;
    }
    .day-detail-popup .popup-tide-range {
      font-size: 13px;
      color: #e94560;
      margin-bottom: 6px;
    }
    .day-detail-popup .popup-tides {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .day-detail-popup .popup-tide-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 2px 0;
    }
    .day-detail-popup .popup-tide-row .pt-type {
      width: 44px;
      font-weight: 600;
    }
    .day-detail-popup .popup-tide-row .pt-type.high { color: #e94560; }
    .day-detail-popup .popup-tide-row .pt-type.low { color: #5b9bd5; }
    .day-detail-popup .popup-tide-row .pt-time {
      width: 52px;
      color: #c0c0d0;
      font-variant-numeric: tabular-nums;
    }
    .day-detail-popup .popup-tide-row .pt-height {
      color: #a0a0b0;
    }
    .day-detail-popup .popup-tide-row .pt-dn {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
    }

    /* ── 潮汐明細 Modal Overlay ── */
    .tide-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .tide-modal-overlay.active {
      display: flex;
    }
    .tide-modal {
      background: #1a2744;
      border: 1px solid #3a5a6a;
      border-radius: 12px;
      padding: 16px 18px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .tide-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .tide-modal-header-left .tm-date {
      font-size: 17px;
      font-weight: 700;
      color: #e0e0e0;
    }
    .tide-modal-header-left .tm-lunar {
      font-size: 13px;
      color: #808090;
      margin-top: 2px;
    }
    .tide-modal-header-left .tm-tide-range {
      font-size: 13px;
      color: #e94560;
      margin-top: 4px;
    }
    .tide-modal-close {
      background: none;
      border: none;
      color: #808090;
      font-size: 22px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      flex-shrink: 0;
    }
    .tide-modal-close:hover { color: #e0e0e0; }
    .tide-modal-tides {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tide-modal-tide-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(255,255,255,0.03);
    }
    .tide-modal-tide-row .tm-type {
      width: 44px;
      font-weight: 700;
    }
    .tide-modal-tide-row .tm-type.high { color: #e94560; }
    .tide-modal-tide-row .tm-type.low { color: #5b9bd5; }
    .tide-modal-tide-row .tm-time {
      width: 56px;
      color: #c0c0d0;
      font-variant-numeric: tabular-nums;
    }
    .tide-modal-tide-row .tm-height {
      flex: 1;
      color: #a0a0b0;
      font-variant-numeric: tabular-nums;
    }
    .tide-modal-tide-row .tm-dn {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>🐦 賞鳥潮汐查詢</h1>

  <!-- Tab 切換 -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('detail')">3-7天潮汐+天氣</button>
    <button class="tab-btn" onclick="switchTab('top3')">未來一個月潮汐最高日期</button>
    <button class="tab-btn" onclick="switchTab('annual')">年度潮汐月曆</button>
  </div>

  <!-- 地區按鈕方格 -->
  <div class="location-grid" id="locationGrid">
    {% for key, info in locations.items() %}
    <button class="loc-btn" data-key="{{ key }}" onclick="selectLocation('{{ key }}')">{{ info.label }}</button>
    {% endfor %}
  </div>

  <!-- 天數選擇器（功能二） -->
  <div class="days-selector" id="daysSelector">
    <label>查詢天數：</label>
    <select id="daysSelect" onchange="refreshDetail()">
      <option value="3" selected>3 天</option>
      <option value="4">4 天</option>
      <option value="5">5 天</option>
      <option value="6">6 天</option>
      <option value="7">7 天</option>
    </select>
  </div>

  <!-- 功能一：最高五天 -->
  <div class="result-panel" id="panelTop3">
    <div class="loading">請選擇地區查看未來一個月潮汐最高日期</div>
  </div>

  <!-- 功能二：3-7天詳細 -->
  <div class="result-panel active" id="panelDetail">
    <div class="loading">請選擇地區查看未來3-7天潮汐及天氣預報</div>
  </div>

  <!-- 功能三：年度潮汐月曆 -->
  <div class="result-panel" id="panelAnnual">
    <div class="loading">請選擇地區查看年度潮汐月曆</div>
  </div>

  <div class="footer">
    資料來源：交通部中央氣象署 CWA Open Data API<br>
    Sam Tsai 製作，歡迎公益使用
  </div>

  <!-- 潮汐明細 Modal -->
  <div class="tide-modal-overlay" id="tideModalOverlay" onclick="closeTideModal(event)">
    <div class="tide-modal" id="tideModalContent">
      <div class="tide-modal-header">
        <div class="tide-modal-header-left">
          <div class="tm-date" id="tmDate"></div>
          <div class="tm-lunar" id="tmLunar"></div>
          <div class="tm-tide-range" id="tmTideRange"></div>
        </div>
        <button class="tide-modal-close" onclick="closeTideModal(event)">&times;</button>
      </div>
      <div class="tide-modal-tides" id="tmTides"></div>
    </div>
  </div>

  <script>
    let currentTab = 'detail';
    let currentLocation = null;

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById('panelTop3').classList.remove('active');
      document.getElementById('panelDetail').classList.remove('active');
      document.getElementById('panelAnnual').classList.remove('active');

      if (tab === 'top3') {
        document.getElementById('panelTop3').classList.add('active');
        document.getElementById('daysSelector').style.display = 'none';
      } else if (tab === 'annual') {
        document.getElementById('panelAnnual').classList.add('active');
        document.getElementById('daysSelector').style.display = 'none';
      } else {
        document.getElementById('panelDetail').classList.add('active');
        document.getElementById('daysSelector').style.display = 'flex';
      }

      if (currentLocation) {
        if (tab === 'top3') loadTop3(currentLocation);
        else if (tab === 'annual') loadAnnual(currentLocation);
        else loadDetail(currentLocation);
      }
    }

    function selectLocation(key) {
      currentLocation = key;
      document.querySelectorAll('.loc-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.loc-btn[data-key="${key}"]`).classList.add('active');

      if (currentTab === 'top3') loadTop3(key);
      else if (currentTab === 'annual') loadAnnual(key);
      else loadDetail(key);
    }

    function refreshDetail() {
      if (currentLocation && currentTab === 'detail') {
        loadDetail(currentLocation);
      }
    }

    async function loadTop3(key) {
      const panel = document.getElementById('panelTop3');
      panel.innerHTML = '<div class="loading">查詢中...</div>';
      try {
        const res = await fetch(`/api/top3-tides/${key}`);
        const data = await res.json();
        if (data.error) {
          panel.innerHTML = `<div class="error">❌ ${data.error}</div>`;
          return;
        }
        renderTop3(data);
      } catch (e) {
        panel.innerHTML = `<div class="error">❌ 連線錯誤: ${e.message}</div>`;
      }
    }

    function renderTop3(data) {
      const panel = document.getElementById('panelTop3');
      let html = `<div class="top3-card">
        <h3>${data.location}</h3>
        <table class="top4-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>農曆</th>
              <th>潮差</th>
              <th>時段一</th>
              <th>潮高</th>
              <th>時段二</th>
              <th>潮高</th>
            </tr>
          </thead>
          <tbody>`;

      data.top4.forEach((day, i) => {
        const dateFmt = formatDate(day.date);
        const lunarFmt = formatLunar(day.lunar);
        const tides = day.tides;
        const maxH = day.max_height;

        let t1Time = '<span class="dash">--</span>';
        let t1Height = '<span class="dash">--</span>';
        if (tides.length >= 1) {
          const t1 = tides[0];
          const cls = t1.height_val === maxH ? 'max' : 'non-max';
          t1Time = `<span class="t-time">${t1.time}</span>`;
          t1Height = `<span class="t-height ${cls}">${t1.height}</span>`;
        }

        let t2Time = '<span class="dash">--</span>';
        let t2Height = '<span class="dash">--</span>';
        if (tides.length >= 2) {
          const t2 = tides[1];
          const cls = t2.height_val === maxH ? 'max' : 'non-max';
          t2Time = `<span class="t-time">${t2.time}</span>`;
          t2Height = `<span class="t-height ${cls}">${t2.height}</span>`;
        }

        html += `<tr>
          <td class="date">${dateFmt}</td>
          <td class="lunar">${lunarFmt}</td>
          <td class="tide-range">${day.tide_range}</td>
          <td>${t1Time}</td>
          <td>${t1Height}</td>
          <td>${t2Time}</td>
          <td>${t2Height}</td>
        </tr>`;
      });

      html += `</tbody></table></div>
        <div style="text-align:center; color:#808090; font-size:11px; margin-top:8px;">
          潮高基準：相對當地平均海平面 (cm)<br>
          紅色為當日最高潮高
        </div>`;
      panel.innerHTML = html;
    }

    async function loadDetail(key) {
      const days = document.getElementById('daysSelect').value;
      const panel = document.getElementById('panelDetail');
      panel.innerHTML = '<div class="loading">查詢中...</div>';
      try {
        const res = await fetch(`/api/combined/${key}?days=${days}`);
        const data = await res.json();
        if (data.error) {
          panel.innerHTML = `<div class="error">❌ ${data.error}</div>`;
          return;
        }
        renderDetail(data);
      } catch (e) {
        panel.innerHTML = `<div class="error">❌ 連線錯誤: ${e.message}</div>`;
      }
    }

    function renderDetail(data) {
      const panel = document.getElementById('panelDetail');
      let html = `<div style="text-align:center; font-size:16px; color:#e94560; margin-bottom:12px; font-weight:600;">
        ${data.location}
      </div>`;

      if (data.tide) {
        data.tide.days.forEach(day => {
          const dateFmt = formatDate(day.date);
          const lunarFmt = formatLunar(day.lunar);
          html += `<div class="detail-day">
            <div class="detail-day-header">
              <span class="date">${dateFmt}</span>
              <span class="lunar">${lunarFmt}</span>
              <span class="tide-range">潮差：${day.tide_range}</span>
            </div>
            <div class="detail-body">`;

          day.tides.forEach(t => {
            const dnClass = t.is_daytime ? 'dn-day' : 'dn-night';
            const dnText = t.is_daytime ? '白' : '夜';
            const typeClass = t.tide_type === '滿潮' ? 'high' : 'low';
            html += `<div class="tide-row">
              <span class="type ${typeClass}">${t.tide_type}</span>
              <span class="t-time">${t.time}</span>
              <span class="t-height">${t.height} cm</span>
              <span class="t-dn ${dnClass}">${dnText}</span>
            </div>`;
          });

          if (data.weather && data.weather.length > 0) {
            const dayWeather = data.weather.filter(w => {
              return w.start && w.start.substring(0, 10) === day.date;
            });

            if (dayWeather.length > 0) {
              html += `<div class="weather-section">
                <h4>天氣預報</h4>
                <div class="weather-row weather-header">
                  <span>時段</span>
                  <span>天氣</span>
                  <span>溫</span>
                  <span>雨</span>
                  <span>風速</span>
                  <span>風向</span>
                </div>`;

              dayWeather.forEach(w => {
                const period = w.is_daytime ? '白天' : '晚上';
                const wx = w.wx || '-';
                const temp = w.temp ? w.temp + '°' : '-';
                const pop = w.pop ? w.pop + '%' : '-';
                const ws = w.wind_speed || '-';
                const wd = w.wind_dir || '-';

                const wxClass = wx.includes('雨') || wx.includes('陣') ? 'wx-rain' : 'wx-clear';
                const popClass = parseInt(w.pop) >= 50 ? 'pop-high' : '';

                html += `<div class="weather-row weather-data">
                  <span>${period}</span>
                  <span class="${wxClass}">${wx}</span>
                  <span>${temp}</span>
                  <span class="${popClass}">${pop}</span>
                  <span>${ws}級</span>
                  <span>${wd}</span>
                </div>`;
              });

              html += `</div>`;
            }
          }

          // 日出日落
          if (data.sunrise_sunset && data.sunrise_sunset[day.date]) {
            const sun = data.sunrise_sunset[day.date];
            html += `<div class="sun-section">
              <span class="sun-item"><span class="sun-icon">↑</span> 日出 <span class="sun-time">${sun.sunrise}</span></span>
              <span class="sun-item"><span class="sun-icon">↓</span> 日落 <span class="sun-time">${sun.sunset}</span></span>
            </div>`;
          }

          html += `</div></div>`;
        });
      }

      if (data.tide_error) {
        html += `<div class="error">潮汐資料錯誤: ${data.tide_error}</div>`;
      }
      if (data.weather_error) {
        html += `<div class="error">天氣資料錯誤: ${data.weather_error}</div>`;
      }

      html += `<div style="text-align:center; color:#808090; font-size:11px; margin-top:8px;">
        潮高基準：相對當地平均海平面 (cm) | 白天：06:00-18:00
      </div>`;

      panel.innerHTML = html;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      const m = d.getMonth() + 1;
      const day = d.getDate();
      const w = weekdays[d.getDay()];
      return `${m}/${day}(${w})`;
    }

    function formatLunar(lunarStr) {
      if (!lunarStr) return '';
      // 農曆格式 "2026-07-01" → "農曆7/01"
      const parts = lunarStr.split('-');
      if (parts.length >= 3) {
        return '農曆' + parseInt(parts[1]) + '/' + parseInt(parts[2]);
      }
      return lunarStr;
    }

    // ── 功能三：年度潮汐月曆 ──

    let annualCache = null;
    let annualSelectedDate = null;

    async function loadAnnual(key) {
      const panel = document.getElementById('panelAnnual');
      if (annualCache && annualCache._key === key) {
        renderAnnual(annualCache);
        return;
      }
      panel.innerHTML = '<div class="loading">查詢中...</div>';
      try {
        const res = await fetch(`/api/annual-tides/${key}`);
        const data = await res.json();
        if (data.error) {
          panel.innerHTML = `<div class="error">❌ ${data.error}</div>`;
          return;
        }
        data._key = key;
        annualCache = data;
        annualSelectedDate = null;
        renderAnnual(data);
      } catch (e) {
        panel.innerHTML = `<div class="error">❌ 連線錯誤: ${e.message}</div>`;
      }
    }

    function getTideLevel(maxH) {
      // 將潮高對應到 0-8 色階
      // 大約範圍：0cm → level 0, 300+cm → level 8
      if (maxH < 0) return 0;
      if (maxH < 30) return 1;
      if (maxH < 60) return 2;
      if (maxH < 100) return 3;
      if (maxH < 130) return 4;
      if (maxH < 160) return 5;
      if (maxH < 200) return 6;
      if (maxH < 250) return 7;
      return 8;
    }

    function isSpringTide(dayData) {
      // 優先使用後端計算的 is_spring 欄位（根據潮差或月排名前30%）
      if (dayData.is_spring !== undefined) return dayData.is_spring;
      // Fallback：無 is_spring 時用農曆日期判斷
      if (dayData.tide_range === '大') return true;
      if (dayData.tide_range && dayData.tide_range !== '') return false;
      if (!dayData.lunar) return false;
      const parts = dayData.lunar.split('-');
      if (parts.length < 3) return false;
      const lunarDay = parseInt(parts[2]);
      return (lunarDay >= 1 && lunarDay <= 5) || (lunarDay >= 14 && lunarDay <= 20);
    }

    function renderAnnual(data) {
      const panel = document.getElementById('panelAnnual');
      let html = `<div style="text-align:center; font-size:16px; color:#e94560; margin-bottom:8px; font-weight:600;">
        ${data.location}
      </div>`;

      // 資料來源標記
      html += `<div class="annual-source-wrap">
        <span class="annual-source-badge local">中央氣象署每年10月更新年度資料</span>
      </div>`;

      // 色階圖例
      html += `<div class="calendar-legend">
        <span class="legend-label">低</span>`;
      for (let i = 0; i <= 8; i++) {
        html += `<span class="legend-swatch tide-level-${i}"></span>`;
      }
      html += `<span class="legend-label">高</span>
        <span class="legend-label" style="margin-left:8px;">▎大潮</span>
      </div>`;

      // 取得所有月份的潮高範圍（用於全期 normalization）
      const months = data.months;
      const sortedYm = Object.keys(months).sort();

      // 月份名稱
      const monthNames = ['','一月','二月','三月','四月','五月','六月',
        '七月','八月','九月','十月','十一月','十二月'];

      // 產生每個月的月曆
      sortedYm.forEach(ym => {
        const m = months[ym];
        const year = m.year;
        const month = m.month;

        // 該月第一天是星期幾 (0=週日)
        const firstDay = new Date(year, month - 1, 1).getDay();
        // 該月天數
        const daysInMonth = new Date(year, month, 0).getDate();

        html += `<div class="month-card">
          <div class="month-card-header">${year}年 ${monthNames[month]}</div>
          <div class="calendar-grid">
            <div class="cal-weekday">日</div>
            <div class="cal-weekday">一</div>
            <div class="cal-weekday">二</div>
            <div class="cal-weekday">三</div>
            <div class="cal-weekday">四</div>
            <div class="cal-weekday">五</div>
            <div class="cal-weekday">六</div>`;

        // 空白格
        for (let i = 0; i < firstDay; i++) {
          html += '<div class="cal-day empty"></div>';
        }

        // 每一天
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const dayData = m.days[dateStr];

          if (dayData) {
            const level = getTideLevel(dayData.max_height);
            const isSpring = isSpringTide(dayData);
            const springMark = isSpring ? '<span class="spring-tide-mark"></span>' : '';
            html += `<div class="cal-day has-data tide-level-${level}" data-date="${dateStr}" onclick="selectCalendarDay('${dateStr}')">
              ${springMark}
              <span class="day-num">${d}</span>
              <span class="day-tide">${dayData.max_height >= 0 ? dayData.max_height : ''}</span>
            </div>`;
          } else {
            html += `<div class="cal-day empty tide-level-0">
              <span class="day-num" style="color:#505060">${d}</span>
            </div>`;
          }
        }

        html += '</div></div>';
      });

      // 點選日期明細區（已改用 modal overlay）

      html += `<div style="text-align:center; color:#808090; font-size:11px; margin-top:8px;">
        潮高基準：相對當地平均海平面 (cm) | 點擊日期查看當日潮汐明細
      </div>`;

      panel.innerHTML = html;

      // 如果有選中的日期，重新顯示明細
      if (annualSelectedDate) {
        selectCalendarDay(annualSelectedDate);
      }
    }

    function selectCalendarDay(dateStr) {
      if (!annualCache) return;
      annualSelectedDate = dateStr;

      // 標記選中
      document.querySelectorAll('.cal-day.has-data').forEach(el => {
        el.classList.remove('selected');
      });
      const target = document.querySelector(`.cal-day[data-date="${dateStr}"]`);
      if (target) target.classList.add('selected');

      // 找到該日資料
      const ym = dateStr.slice(0, 7);
      const months = annualCache.months;
      const dayData = months[ym] && months[ym].days[dateStr];
      if (!dayData) return;

      // 填入 modal 內容
      const dateFmt = formatDate(dateStr);
      const lunarFmt = formatLunar(dayData.lunar);
      const isSpring = isSpringTide(dayData);
      const tideRangeText = dayData.tide_range ? `潮差：${dayData.tide_range}` : (isSpring ? '潮差：大潮' : '');

      document.getElementById('tmDate').textContent = dateFmt;
      document.getElementById('tmLunar').textContent = lunarFmt;
      document.getElementById('tmTideRange').textContent = tideRangeText;

      let tidesHtml = '';
      dayData.tides.forEach(t => {
        const dnClass = t.is_daytime ? 'dn-day' : 'dn-night';
        const dnText = t.is_daytime ? '白' : '夜';
        const typeClass = t.tide_type === '滿潮' ? 'high' : 'low';
        tidesHtml += `<div class="tide-modal-tide-row">
          <span class="tm-type ${typeClass}">${t.tide_type}</span>
          <span class="tm-time">${t.time}</span>
          <span class="tm-height">${t.height} cm</span>
          <span class="tm-dn ${dnClass}">${dnText}</span>
        </div>`;
      });
      document.getElementById('tmTides').innerHTML = tidesHtml;

      // 顯示 modal
      document.getElementById('tideModalOverlay').classList.add('active');
    }

    function closeTideModal(event) {
      // 只在點擊 overlay 背景或關閉按鈕時關閉，不關閉 modal 內容
      if (event && event.target !== event.currentTarget && !event.target.classList.contains('tide-modal-close')) return;
      document.getElementById('tideModalOverlay').classList.remove('active');
    }
  </script>
</body>
</html>
